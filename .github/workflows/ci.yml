name: CI

on:
  push:
    branches: [ main, 'b1-*', 'b2-*', 'b3-*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-14 ]
        python-version: [ '3.11', '3.12' ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache spaCy models and NLTK data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/spacy
            ~/nltk_data
          key: ${{ runner.os }}-py${{ matrix.python-version }}-spacy-nltk-v1

      - name: Install reader-toolbox (editable) and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Install spaCy models
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download en_core_web_md

      - name: Provision NLTK data
        run: python -m nltk.downloader punkt_tab averaged_perceptron_tagger_eng wordnet stopwords

      # No Docker service container: GitHub's macOS-hosted runners have no
      # Docker daemon at all, and a job-level `services:` block can't be
      # scoped to one OS in a matrix, so it would break every macOS run
      # before any of our own steps even started. Starting the same
      # tika-server.jar the toolbox downloads for itself works on both
      # ubuntu-latest and macos-14, since Java 17 is already set up above.
      - name: Start Tika
        run: |
          curl -sSL -o /tmp/tika-server.jar https://distantreader.org/apps/tika-server.jar
          # verified sha256 for Tika 1.24.1, recorded in Plan A's A1.4
          # (verification/logs/A1.4-tika-mallet-versions.txt); shasum, not
          # sha256sum, since the latter isn't on macOS runners by default
          echo "466ae64b3f6fa52fe08bfa2b0339671e69988e84fd8bb0a359d345ff0ae024a3  /tmp/tika-server.jar" | shasum -a 256 -c -
          nohup java -jar /tmp/tika-server.jar > /tmp/tika.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:9998/ && break
            sleep 3
          done

      - name: Run tests
        env:
          HOME: ${{ runner.temp }}
        run: pytest tests -v

  # 35 of 45 notebooks are fixed and run here. The other 10 call
  # rdr.download()/rdr.catalog(location='remote') against the real public
  # library at distantreader.org; even with this runner's real outbound
  # network, distantreader.org itself is unreliable enough from a CI IP
  # (BadZipFile/JSONDecodeError from truncated or error-page responses,
  # confirmed on 2026-09-18 -- not a toolbox bug) that they're excluded
  # from this job for now rather than flaking it. The 10 notebook files
  # themselves are untouched -- this is a CI-collection exclusion only, so
  # they still work for local/manual use against a real network. Revisit
  # if distantreader.org gets more CI-friendly (retries, a stable mirror,
  # etc.); see docs/notebooks.rst for their per-notebook status.
  notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install reader-toolbox (editable) with the notebooks extra, and nbmake
        run: |
          python -m pip install --upgrade pip
          pip install -e .[notebooks]
          pip install pytest nbmake

      - name: Install spaCy models and NLTK data
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download en_core_web_md
          python -m nltk.downloader punkt_tab averaged_perceptron_tagger_eng wordnet stopwords

      # Same tika-server.jar the toolbox downloads for itself (see the
      # `test` job's identical step) -- NOT the apache/tika:latest Docker
      # image this job used before. That image floats to whatever Tika
      # release is current (Tika 4.0.0 as of this fix), and Tika 4's REST
      # response schema moved extracted text from a top-level `content`
      # field into `metadata['tk:content']`; the `tika-python` client
      # (last released for the old schema) then reads `content` as None.
      # _file2bib() treats empty content as "nothing to do" and silently
      # returns without writing anything -- no error, just an empty
      # carrel. Real users never hit this: _checkForTika() downloads a
      # specific pinned jar (Tika 1.24.1, confirmed in Plan A's A1.4),
      # never "latest". Root-caused via a temporary diagnostic step
      # (removed here) that compared a raw curl against the Tika REST API
      # to tika-python's own parser.from_file() on the same file.
      - name: Start Tika
        run: |
          curl -sSL -o /tmp/tika-server.jar https://distantreader.org/apps/tika-server.jar
          # verified sha256 for Tika 1.24.1, recorded in Plan A's A1.4
          # (verification/logs/A1.4-tika-mallet-versions.txt)
          echo "466ae64b3f6fa52fe08bfa2b0339671e69988e84fd8bb0a359d345ff0ae024a3  /tmp/tika-server.jar" | shasum -a 256 -c -
          nohup java -jar /tmp/tika-server.jar > /tmp/tika.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:9998/ && break
            sleep 3
          done

      # most notebooks default their carrel parameter to 'mini' (see
      # docs/notebooks.rst); build it once here so they don't each have to
      - name: Build the mini carrel
        run: rdr build mini tests/fixtures/mini

      # rdr build can exit 0 while having silently written nothing (e.g.
      # the Tika-schema mismatch this job just hit): _file2bib() treats
      # empty extracted text as "nothing to do" and returns quietly, with
      # no error anywhere in the build's own output. Left unchecked, that
      # produces ~26 unrelated-looking notebook failures (wordcloud "got 0
      # words", "empty vocabulary", int(None) from extents()) that all
      # trace back to the one real cause but give no indication of it.
      # Fail fast here instead, with a message that names the actual
      # problem.
      - name: Sanity-check the mini carrel isn't empty
        run: |
          COUNT=$(sqlite3 "$HOME/reader-library/mini/etc/carrel.db" "select count(*) from bib;")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::mini carrel build produced 0 bib rows. rdr build exited 0 but wrote nothing -- most likely Tika returned no extractable text (check the Tika server version/response schema; see the 'Start Tika' step's comment above for the exact failure this caught before). Every notebook below will fail with unrelated-looking errors if this ships unnoticed."
            exit 1
          fi
          echo "mini carrel: $COUNT bib rows"

      # excluded: need real, reliable network to distantreader.org (see the
      # job-level comment above) -- not run here, but still real, working
      # notebooks for local/manual use.
      - name: Run notebooks against the mini carrel
        run: >
          pytest --nbmake notebooks/ --nbmake-timeout=600
          --ignore=notebooks/001-introduction-part-i.ipynb
          --ignore=notebooks/010-catalog-reader-library.ipynb
          --ignore=notebooks/015-ngrams.ipynb
          --ignore=notebooks/020-download.ipynb
          --ignore=notebooks/021-catalog-your-library.ipynb
          --ignore=notebooks/024-bibliographics.ipynb
          --ignore=notebooks/025-urls.ipynb
          --ignore=notebooks/026-email-addresses.ipynb
          --ignore=notebooks/108-catalog.ipynb
          --ignore=notebooks/109-harvest.ipynb

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reader-toolbox (editable) with docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      # commands.rst is sphinx-click-generated from the live CLI (Plan B4),
      # so this check guards the two ways that can quietly break: someone
      # reverting to a hand-written command list, or a re-enabled command
      # left listed under "Removed commands".
      - name: Check docs/commands.rst hasn't drifted from the live CLI
        run: python scripts/check_docs_drift.py

      - name: Build docs (warnings as errors)
        run: sphinx-build -W -b html docs docs/_build/html

      - name: Check external links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
